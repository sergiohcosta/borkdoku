apiVersion: apps/v1
kind: Deployment
metadata:
  name: borkdoku
  labels:
    app: borkdoku
spec:
  replicas: 1
  selector:
    matchLabels:
      app: borkdoku
  template:
    metadata:
      labels:
        app: borkdoku
    spec:
      containers:
      - name: borkdoku
        image: borkdoku:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
